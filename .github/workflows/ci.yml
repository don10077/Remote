# CI: сборка и тесты на каждый коммит и pull request — Linux, Windows, macOS.
#
# Каждая сборка, кроме core-only, выкладывает пакет в артефакты запуска:
#   Linux   — Harmony-<версия>-x86_64.AppImage;
#   Windows — установщик Harmony-<версия>-setup.exe и портативный .zip;
#   macOS   — Harmony-<версия>-macos.dmg (универсальный: Apple Silicon и Intel).
# Тег v* (например, v0.2.0) — ещё и релиз на GitHub с этими файлами.
#
# Все actions закреплены по полному SHA коммита (owner/action@<sha40> # vX.Y.Z),
#   SHA сверены через git ls-remote --tags. Обновляет их Dependabot
#   (.github/dependabot.yml) — SHA и комментарий вместе, одним PR.
#
# Кэш: ccache (.ccache в рабочей папке) и исходники FetchContent (build/<пресет>/_deps) — через actions/cache.
# Ключ зависит от файлов, где объявлены FetchContent: cmake/Dependencies.cmake и
# third_party/libconcord/CMakeLists.txt (libzip для macOS).

name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Новый коммит в ту же ветку отменяет ещё идущую сборку прошлого.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 500M
  # Qt для Linux и macOS: последний LTS. Windows берёт Qt из MSYS2 — там всегда свежий.
  QT_VERSION: "6.12.0"

# Коммиты выпуска называются «Release Harmony <версия>» и отправляются вместе с тегом v*.
# Для них пропускаем задания push по ветке: все проверки и пакеты выполняет запуск по тегу.
# Обычные коммиты, pull request и ручные запуски проходят полный CI.

jobs:
  # --- Ядро без Qt, предупреждения = ошибки: самая быстрая проверка ---------------
  core-only:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || !startsWith(github.event.head_commit.message, 'Release Harmony ')
    name: Core (GCC, -Werror)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Пакеты
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache libudev-dev libzip-dev pkg-config libgtest-dev libpugixml-dev nlohmann-json3-dev zlib1g-dev
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .ccache
            build/core-only/_deps/*-src
            build/core-only/_deps/*-subbuild
          key: build-${{ runner.os }}-${{ github.job }}-${{ hashFiles('cmake/Dependencies.cmake', 'third_party/libconcord/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-${{ github.job }}-${{ hashFiles('cmake/Dependencies.cmake', 'third_party/libconcord/CMakeLists.txt') }}-
      - name: Настройка
        run: cmake --preset core-only
      - name: Сборка
        run: cmake --build --preset core-only
      - name: Тесты
        run: ctest --preset core-only

  # --- Ядро на Clang с libc++ — той же стандартной библиотекой, что на macOS ----
  # libc++ строже libstdc++ к include: ловит забытый <algorithm> за минуту, а не в сборке macOS.
  core-libcxx:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || !startsWith(github.event.head_commit.message, 'Release Harmony ')
    name: Core (Clang, libc++)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Пакеты
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache libudev-dev libzip-dev pkg-config clang libc++-dev libc++abi-dev
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .ccache
            build/core-only/_deps/*-src
            build/core-only/_deps/*-subbuild
          key: build-${{ runner.os }}-${{ github.job }}-${{ hashFiles('cmake/Dependencies.cmake', 'third_party/libconcord/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-${{ github.job }}-${{ hashFiles('cmake/Dependencies.cmake', 'third_party/libconcord/CMakeLists.txt') }}-
      # GoogleTest и pugixml — из исходников: системные собраны под libstdc++.
      - name: Настройка
        run: >-
          cmake --preset core-only
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS=-stdlib=libc++ -DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++
          -DCMAKE_DISABLE_FIND_PACKAGE_googletest=ON -DCMAKE_DISABLE_FIND_PACKAGE_pugixml=ON
      - name: Сборка
        run: cmake --build --preset core-only
      - name: Тесты
        run: ctest --preset core-only

  # --- Ядро и тесты с AddressSanitizer и UndefinedBehaviorSanitizer (GCC) -------
  asan-ubsan:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || !startsWith(github.event.head_commit.message, 'Release Harmony ')
    name: Core (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Пакеты
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache libudev-dev libzip-dev pkg-config libgtest-dev libpugixml-dev nlohmann-json3-dev zlib1g-dev
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .ccache
            build/asan-ubsan/_deps/*-src
            build/asan-ubsan/_deps/*-subbuild
          key: build-${{ runner.os }}-${{ github.job }}-${{ hashFiles('cmake/Dependencies.cmake', 'third_party/libconcord/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-${{ github.job }}-${{ hashFiles('cmake/Dependencies.cmake', 'third_party/libconcord/CMakeLists.txt') }}-
      - name: Настройка
        run: cmake --preset asan-ubsan
      - name: Сборка
        run: cmake --build --preset asan-ubsan
      - name: Тесты
        run: ctest --preset asan-ubsan

  # --- libFuzzer: короткий прогон разборщиков (по 60 с на цель) ---------------
  fuzz:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || !startsWith(github.event.head_commit.message, 'Release Harmony ')
    name: Fuzz (libFuzzer, 60 s)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Для Clang 19 нужны также clang-scan-deps (CMake/Ninja) и compiler-rt (libFuzzer).
      - name: Пакеты
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache libudev-dev libzip-dev pkg-config \
            clang-19 clang-tools-19 libclang-rt-19-dev libpugixml-dev nlohmann-json3-dev zlib1g-dev
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .ccache
            build/fuzz/_deps/*-src
            build/fuzz/_deps/*-subbuild
          key: build-${{ runner.os }}-${{ github.job }}-${{ hashFiles('cmake/Dependencies.cmake', 'third_party/libconcord/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-${{ github.job }}-${{ hashFiles('cmake/Dependencies.cmake', 'third_party/libconcord/CMakeLists.txt') }}-
      - name: Настройка
        run: cmake --preset fuzz -DCMAKE_C_COMPILER=clang-19 -DCMAKE_CXX_COMPILER=clang++-19
      - name: Сборка
        run: cmake --build --preset fuzz
      - name: Прогон
        run: bash fuzz/run.sh build/fuzz 60
      # Входы, на которых упало: скачать и воспроизвести — build/fuzz/fuzz/fuzz_<цель> <файл>.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crashes
          path: build/fuzz/fuzz-crashes/
          if-no-files-found: ignore

  # --- Linux: приложение, тесты, AppImage ------------------------------------
  linux:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || !startsWith(github.event.head_commit.message, 'Release Harmony ')
    name: Linux (AppImage)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Пакеты
        # libxcb-*, libxkbcommon-x11: зависимости плагина xcb, которые linuxdeploy кладёт в AppImage.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache libudev-dev libzip-dev pkg-config libgtest-dev libpugixml-dev nlohmann-json3-dev zlib1g-dev \
            libgl1-mesa-dev libegl-dev libxkbcommon-dev libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      # Qt 6.5+ нужен программе, а в Ubuntu 24.04 только 6.4 — берём официальную сборку Qt.
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .ccache
            build/release/_deps/*-src
            build/release/_deps/*-subbuild
          key: build-${{ runner.os }}-${{ github.job }}-${{ hashFiles('cmake/Dependencies.cmake', 'third_party/libconcord/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-${{ github.job }}-${{ hashFiles('cmake/Dependencies.cmake', 'third_party/libconcord/CMakeLists.txt') }}-
      - name: Настройка
        run: cmake --preset release
      - name: Сборка
        run: cmake --build --preset release
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # setup-python v7 убрал параметр pip-install — ставим opencv (нужен авто-зонам в тестах) сами.
      - name: opencv для авто-зон
        run: python -m pip install opencv-python-headless==4.12.0.88
      - name: Тесты
        run: ctest --preset release
      - name: AppImage
        run: bash tools/make-appimage.sh build/release dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harmony-linux
          path: dist/*.AppImage
          if-no-files-found: error

  # --- Windows (MSYS2 UCRT64, как build.cmd): тесты, установщик, zip -----------
  windows:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || !startsWith(github.event.head_commit.message, 'Release Harmony ')
    name: Windows (installer)
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-translations
            mingw-w64-ucrt-x86_64-gtest
            mingw-w64-ucrt-x86_64-libzip
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-pugixml
            mingw-w64-ucrt-x86_64-nsis
      # ccache из MSYS2 находит корневой CMakeLists.txt (HARMONY_USE_CCACHE), CCACHE_DIR — из env.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .ccache
            build/release/_deps/*-src
            build/release/_deps/*-subbuild
          key: build-ucrt64-${{ runner.os }}-${{ github.job }}-${{ hashFiles('cmake/Dependencies.cmake', 'third_party/libconcord/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            build-ucrt64-${{ runner.os }}-${{ github.job }}-${{ hashFiles('cmake/Dependencies.cmake', 'third_party/libconcord/CMakeLists.txt') }}-
      # Пресеты win-* живут в локальном CMakeUserPresets.json; здесь MSYS2 уже в PATH,
      # поэтому подходит обычный release.
      - name: Настройка
        run: cmake --preset release
      - name: Сборка
        run: cmake --build --preset release
      # Попадания в кэш: со второго прогона hits должно быть большинство.
      - name: Статистика ccache
        run: ccache --show-stats
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # setup-python v7 убрал параметр pip-install — ставим opencv (нужен авто-зонам в тестах) сами.
      # Оболочка по умолчанию здесь msys2, а нужен Python из setup-python — берём его по pythonLocation.
      - name: opencv для авто-зон
        shell: pwsh
        run: '& (Join-Path $env:pythonLocation "python.exe") -m pip install opencv-python-headless==4.12.0.88'
      - name: Тесты
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $ucrtBin = Join-Path $env:MSYS2_ROOT 'ucrt64/bin'
          $env:Path = "$ucrtBin;$env:Path"
          $env:HARMONY_AUTO_ZONES_PYTHON = Join-Path $env:pythonLocation 'python.exe'
          & (Join-Path $ucrtBin 'ctest.exe') --preset release
      - name: Раскладка и установщик
        run: |
          bash tools/deploy-win.sh build/release/app/harmony.exe dist/ucrt64/win build/release/cli/harmony-cli.exe
          bash tools/make-installer-win.sh build/release dist/ucrt64/win dist
          version="$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' build/release/CMakeCache.txt | tr -d '\r')"
          (cd dist/ucrt64/win && zip -qr "../../Harmony-$version-windows-portable.zip" .)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harmony-windows
          path: |
            dist/*-setup.exe
            dist/*-portable.zip
          if-no-files-found: error

  # --- macOS: универсальный бандл и DMG --------------------------------------
  macos:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || !startsWith(github.event.head_commit.message, 'Release Harmony ')
    name: macOS (DMG)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Пакеты
        run: brew install ninja ccache
      # Официальная сборка Qt — универсальная (arm64 + x86_64), в отличие от Homebrew.
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .ccache
            build/release/_deps/*-src
            build/release/_deps/*-subbuild
          key: build-${{ runner.os }}-${{ github.job }}-${{ hashFiles('cmake/Dependencies.cmake', 'third_party/libconcord/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-${{ github.job }}-${{ hashFiles('cmake/Dependencies.cmake', 'third_party/libconcord/CMakeLists.txt') }}-
      - name: Настройка
        run: cmake --preset release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Сборка
        run: cmake --build --preset release
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # setup-python v7 убрал параметр pip-install — ставим opencv (нужен авто-зонам в тестах) сами.
      - name: opencv для авто-зон
        run: python -m pip install opencv-python-headless==4.12.0.88
      - name: Тесты
        run: ctest --preset release
      - name: Бандл и DMG
        run: bash tools/make-macos.sh build/release dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harmony-macos
          path: dist/*.dmg
          if-no-files-found: error

  # --- Релиз по тегу v*: пакеты всех систем -----------------------------------
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core-only, core-libcxx, asan-ubsan, fuzz, linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check release version
        shell: bash
        run: |
          version="$(sed -n 's/^[[:space:]]*VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "Tag $GITHUB_REF_NAME does not match project version v$version"
            exit 1
          }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: packages
          merge-multiple: true
      - name: Package checksums
        working-directory: packages
        run: sha256sum * > SHA256SUMS.txt
      # Закреплён по SHA: сторонний action с правом contents: write.
      # Описание — из .github/release-notes.md (обновлять к каждому выпуску);
      # версии 0.x — предварительные (pre-release).
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: packages/*
          fail_on_unmatched_files: true
          body_path: .github/release-notes.md
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
